# Feature delivery — the built-in workflow: the 13 steps of the workflow canvas.
# FrontFlow is a wrapper that drives AI agents (tmux/terminal sessions) in the opened project
# folder: no worktree, no branch. The agents read the project themselves, so there is no
# "analyze project" step. Every AI step is an editable prompt
# (workflows/prompts/feature-delivery/<step id>.md); each code-changing step is bracketed by
# hidden git snapshots used for review/rollback. FrontFlow runs no build/typecheck/lint gates: an
# AI step passes once its agent session ends, and only agent failures (session, timeout) are retried.
#
# ① B1 starts the run: the UI is built from Figma first, because the API contract is often not
#   ready yet.
# ② A reviews the built UI against the API contract (spec §12). A.api_contract waits for the
#   contract without blocking B1; reading it only saves the files of the latest upload into the
#   run folder in the tool's data (api-contract/); an upload may hold several files and a newer one
#   can be imported at any time. A.review is one editable prompt the agent runs in the project: it
#   checks whether the contract is enough for the UI code (Figma is not read again) and writes a
#   short Markdown review (api-review.md). The "wait for update" loop is a single gate: A.review
#   returns waiting_for_input unless the review's `Đáp ứng: NN%` reaches 92%; importing a newer
#   contract runs it again, provideInput({ accept: true }) continues with the gaps as assumptions.
# ③ B2 starts once the contract has been reviewed and the BA specification has been read:
#   B2.ba_spec waits for the BA (one or more files, a newer upload at any time) and the agent lists
#   its business scenarios and the UI cases it names (ba-scenarios.md). B2.ba_ui_review checks the
#   UI built from Figma against it: the BA decides behaviour (flow, validation, forms, states,
#   business rules); Figma supplies presentation and copy unless BA mandates exact wording. Figma shows less than the BA, so it lists what the UI still
#   lacks (ba-ui-review.md) and waits only while the two conflict. B2.api_binding is one agent
#   session that binds the API and builds what the review lists (tests are written in ④). There is no
#   backend check, so the feature is contract-only (never reported as runtime verified, spec §13.6).
# ④ C1 turns the BA specification into acceptance test cases (spec §5, §14): behaviour from the BA,
#   what the screen shows from the UI and the review's decisions. C1.test_design waits for input
#   unless its conclusion is `Đủ`.
#   C2.ops_guide (optional, no AI, never waits) takes the feature's test operations guide, e.g. how
#   to prepare data in the CMS, for the auto-tests only; importing it later runs C2 again. C2
#   generates the automated tests once the API is integrated and checks them with the unit tests and
#   one short E2E stage; then the agent runs the unit tests (acceptance-tests.md) and, in a session
#   of its own, the E2E tests (e2e-tests.md), fixes implementation/test-generation gaps and reports;
#   FrontFlow runs no test command itself and waits for the user unless a report says `Đạt`.
#
# AI steps set their own model and effort (config.model / config.effort): Opus for what is delivered
# or what the next steps take as the truth (the UI, reading the BA, the UI vs BA review, the API
# integration, the test design), Sonnet for the API review and the tests. Effort is medium (it is
# spent on every turn), except high for the UI vs BA review: one pass, short output, reasoning across
# two sources to decide whether to stop. A model or effort chosen for the run, or for one step of it,
# overrides them.
#
# v8: the three workflow files (ui-implementation, fe-readiness, business-validation) are one
# workflow with its canvas lanes; node ids are unchanged.
# v9: reading the BA moved from C1 into lane ③ (C1.ba_spec → B2.ba_spec): the BA names the UI
# cases to handle, so the API binding and the UI states wait for it.
# v10: B2.api_binding also completes the UI states (B2.ui_states removed) and B2.check_backend is
# gone: nothing set a backend URL, so it always reported contract-only.
# v11: B2.ba_ui_review between the UI and the integration, so what the BA needs beyond Figma is
# built there instead of while running the tests; the E2E tests run in their own step
# (C2.run_e2e); a model and effort per AI step.
# v12: models reviewed: Opus also for AI implements UI (Sonnet gave a UI below the design), Read BA
# specification and the test design; effort medium except for the UI vs BA review.
id: feature-delivery
version: 12
name: Feature delivery
description: UI from Figma, review against the API contract when it arrives, API integration, and BA-driven acceptance tests.
defaults:
  timeoutMs: 600000
  retryPolicy:
    maxAttempts: 1
    backoff: none
    retryableErrors: []

lanes:
  - id: B1
    title: ① Build UI from Figma
    subtitle: "No API needed yet: UI with mock data"
  - id: A
    title: ② Review against API
    subtitle: "When the contract arrives: is the UI covered?"
  - id: B2
    title: ③ Integrate the API
    subtitle: Read BA, check the UI against it, bind the API
  - id: C
    title: ④ Prove it works
    subtitle: Test cases → unit tests → E2E
    groups: [C1, C2]

nodes:
  - id: B1.figma_scope
    type: figma.design
    label: Select Figma scope
    group: B1
    description: Receive the frames pushed from the GoApp Figma plugin's FrontFlow button and snapshot them when you click Run.
    timeoutMs: 180000
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [FIGMA_UNAVAILABLE, NETWORK_ERROR]

  - id: B1.implement_ui
    type: ai.implement_ui
    label: AI implements UI
    group: B1
    description: The agent runs the editable prompt to implement the presentational UI from Figma with mock data (no API yet), with a dev-only bubble to switch between the UI states of the design.
    dependencies: [B1.figma_scope]
    config:
      ai: true
      model: opus
      effort: medium
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 3
      backoff: exponential
      baseDelayMs: 5000
      retryableErrors: [AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: B2.ba_spec
    type: tests.read_ba
    label: Read BA specification
    group: B2
    description: Import the BA specification (Markdown, one or more files), and again whenever it changes (only the latest upload is read); the agent (editable prompt) extracts what the FE needs from it (business rules, actions and outcomes, exceptions, acceptance criteria, the full flow, open points) in a short Markdown report, for the API binding, the UI states and the acceptance tests.
    readOnly: false
    timeoutMs: 0 # AI step: no time limit
    config:
      ai: true
      aiAttempts: 2
      model: opus
      effort: medium
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [IO_ERROR, AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: B2.ba_ui_review
    type: readiness.ba_ui_review
    label: AI reviews UI vs BA
    group: B2
    description: The agent (editable prompt) checks the UI built from Figma against the BA — the BA decides the flow, validation, forms, states and rules, Figma supplies presentation and notification text unless BA mandates exact wording — and lists what the UI still lacks for the integration to build; while the BA and Figma conflict it waits for your decision.
    dependencies: [B1.implement_ui, B2.ba_spec]
    # Not cacheable: the user may accept the proposed choices through provideInput.
    readOnly: false
    timeoutMs: 0 # AI step: no time limit
    config:
      ai: true
      aiAttempts: 2
      model: opus
      effort: high
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: B2.api_binding
    type: ai.api_integration
    label: AI integrates API
    group: B2
    description: API bindings for every interaction of the built UI, then what the UI vs BA review lists (flows, validation, forms, states) and the API errors; the tests are written in lane ④.
    dependencies: [A.review, B2.ba_ui_review]
    config:
      ai: true
      model: opus
      effort: medium
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 3
      backoff: exponential
      baseDelayMs: 5000
      retryableErrors: [AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: A.api_contract
    type: readiness.read_api
    label: Read API contract
    group: A
    description: Import the API contract (Markdown or OpenAPI, one or more files) whenever it is ready, and again whenever it changes; only the files of the latest upload are saved in the run folder for the agent to read.
    # Waits for the user to import the contract; not cacheable because it arrives through provideInput.
    readOnly: false
    timeoutMs: 120000
    retryPolicy:
      maxAttempts: 2
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [IO_ERROR]

  - id: A.review
    type: readiness.review
    label: AI reviews UI vs API
    group: A
    description: The agent checks whether the API contract is enough to implement the UI built from Figma (editable prompt) and writes a short review of what is missing; below 92% coverage it waits for a newer contract or your decision.
    dependencies: [A.api_contract, B1.implement_ui]
    # Not cacheable: the user may accept gaps through provideInput.
    readOnly: false
    timeoutMs: 0 # AI step: no time limit
    config:
      ai: true
      aiAttempts: 2
      model: sonnet
      effort: medium
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C1.test_design
    type: tests.design
    label: Design acceptance tests
    group: C1
    description: The agent (editable prompt) designs the unit tests and the E2E autotests (the full flow with every role, plus 2–3 edge cases) from the BA and the UI vs BA review, as a Markdown report; anything but "enough" waits for a newer BA spec or your decision.
    dependencies: [B2.ba_ui_review]
    # Not cacheable: the user may accept testability gaps through provideInput.
    readOnly: false
    timeoutMs: 0 # AI step: no time limit
    config:
      ai: true
      aiAttempts: 2
      model: opus
      effort: medium
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C2.ops_guide
    type: tests.read_ops_guide
    label: Read test operations guide
    group: C2
    description: Optional. Import the guide the auto-tests follow to prepare test data and preconditions (e.g. in the CMS), and a newer version whenever it changes; without one the step passes.
    readOnly: false
    timeoutMs: 120000
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [IO_ERROR]

  - id: C2.generate_tests
    type: ai.acceptance_tests
    label: AI generates auto-tests
    group: C2
    description: Map the acceptance test cases onto the integrated frontend and write one automated test per test case, preparing test data as the operations guide says; the unit tests and one short E2E stage are run to fix the tests themselves.
    dependencies: [C1.test_design, C2.ops_guide, B2.api_binding]
    config:
      ai: true
      model: sonnet
      effort: medium
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 3
      backoff: exponential
      baseDelayMs: 5000
      retryableErrors: [AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C2.run_tests
    type: test.acceptance
    label: Run unit tests
    group: C2
    description: The agent (editable prompt) runs the feature's unit tests, fixes implementation and test-generation gaps, and reports the result in Markdown; anything but "Đạt" waits for your decision.
    dependencies: [C2.generate_tests]
    config:
      ai: true
      aiAttempts: 2
      model: sonnet
      effort: medium
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 2
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED]

  - id: C2.run_e2e
    type: test.e2e
    label: Run E2E tests
    group: C2
    description: The agent (editable prompt) runs the E2E auto-tests in the real environment — the full flow, then the edge cases — fixes implementation and test gaps, and reports the result in Markdown; anything but "Đạt" waits for your decision.
    dependencies: [C2.run_tests]
    config:
      ai: true
      aiAttempts: 2
      model: sonnet
      effort: medium
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 2
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED]

  - id: C2.evidence_report
    type: report.evidence
    label: Evidence report
    group: C2
    description: Summarize the run's reports, quality gates, Figma, files changed and evidence in a Markdown report.
    dependencies: [C2.run_e2e]
    timeoutMs: 120000
