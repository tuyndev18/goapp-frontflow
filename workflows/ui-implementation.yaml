# Workflow B — UI Implementation & API Integration.
# FrontFlow is a wrapper that drives AI agents (tmux/terminal sessions) in the opened project
# folder: no worktree, no branch. The agents read the project themselves, so there is no
# "analyze project" step. Every AI step is an editable prompt (workflows/prompts/<step id>.md);
# each code-changing step is bracketed by hidden git snapshots used for review/rollback.
#
# B1 starts the run: the UI is built from Figma first, because the API contract is often not
# ready yet. B2 starts once the contract has been reviewed against that UI (A.review).
# FrontFlow runs no build/typecheck/lint gates: an AI step passes once its agent session ends,
# and only agent failures (session, timeout) are retried.
# B2.check_backend runs provider verification when the runtime API is reachable; otherwise the
# feature is contract-only (never reported as runtime verified, spec §13.6).
id: ui-implementation
version: 6
name: UI Implementation & API Integration
description: Build the presentational UI from Figma first, then bind the API once its contract is reviewed and add loading/empty/error/permission states.
requires: [A.review]
defaults:
  timeoutMs: 600000
  retryPolicy:
    maxAttempts: 1
    backoff: none
    retryableErrors: []

nodes:
  - id: B1.figma_scope
    type: figma.design
    label: Select Figma scope
    group: B1
    description: Receive the frames pushed from the GoApp Figma plugin's FrontFlow button and snapshot them when you click Run.
    timeoutMs: 180000
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [FIGMA_UNAVAILABLE, NETWORK_ERROR]

  - id: B1.implement_ui
    type: ai.implement_ui
    label: AI implements UI
    group: B1
    description: The agent runs the editable prompt to implement the presentational UI from Figma with mock data (no API yet).
    dependencies: [B1.figma_scope]
    config:
      ai: true
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 3
      backoff: exponential
      baseDelayMs: 5000
      retryableErrors: [AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: B2.api_binding
    type: ai.api_integration
    label: AI binds API
    group: B2
    description: API client (existing pattern first) and query/mutation bindings for every mapped interaction of the built UI, with consumer contract tests.
    dependencies: [A.review, B1.implement_ui]
    config:
      ai: true
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 3
      backoff: exponential
      baseDelayMs: 5000
      retryableErrors: [AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: B2.check_backend
    type: integration.check_backend
    label: Check backend
    group: B2
    description: Provider verification when the backend is reachable, otherwise contract-only.
    dependencies: [B2.api_binding]
    timeoutMs: 600000
    retryPolicy:
      maxAttempts: 2
      backoff: linear
      baseDelayMs: 5000
      retryableErrors: [NETWORK_ERROR, COMMAND_FAILED]

  - id: B2.ui_states
    type: ai.bind_ui_states
    label: AI adds UI states
    group: B2
    description: Loading, empty, error, disabled and permission states wired to real request state, with component and integration tests.
    dependencies: [B2.check_backend]
    config:
      ai: true
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 3
      backoff: exponential
      baseDelayMs: 5000
      retryableErrors: [AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]
