# Workflow A — review the built UI against the API contract (spec §12).
# The API contract often arrives after the design: the UI is built from Figma first (B1), and
# A.api_contract waits for the contract without blocking that work. Reading the contract only
# saves the files of the latest upload into the run folder in the tool's data (api-contract/); an
# upload may hold several files and a newer one can be imported at any time: only the latest is read. A.review is one editable
# prompt (workflows/prompts/A.review.md) that the agent runs in the project: it checks whether the
# contract is enough for the UI code it finds there (Figma is not read again) and writes a short
# Markdown review (api-review.md) for the next steps' agents. The "wait for update" loop is a single
# gate: A.review returns waiting_for_input unless the review's `Đáp ứng: NN%` reaches 92%; importing a newer
# contract runs it again, provideInput({ accept: true }) continues with the gaps recorded as assumptions.
id: fe-readiness
version: 5
name: Review UI against API contract
description: When the API contract is available, save it into the project and let the agent compare it with the built UI to decide whether the API can be integrated.
requires: [B1.implement_ui]
defaults:
  group: A
  timeoutMs: 300000
  retryPolicy:
    maxAttempts: 1
    backoff: none
    retryableErrors: []

nodes:
  - id: A.api_contract
    type: readiness.read_api
    label: Read API contract
    description: Import the API contract (Markdown or OpenAPI, one or more files) whenever it is ready, and again whenever it changes; only the files of the latest upload are saved in the run folder for the agent to read.
    # Waits for the user to import the contract; not cacheable because it arrives through provideInput.
    readOnly: false
    timeoutMs: 120000
    retryPolicy:
      maxAttempts: 2
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [IO_ERROR]

  - id: A.review
    type: readiness.review
    label: AI reviews UI vs API
    description: The agent checks whether the API contract is enough to implement the UI built from Figma (editable prompt) and writes a short review of what is missing; below 92% coverage it waits for a newer contract or your decision.
    dependencies: [A.api_contract, B1.implement_ui]
    # Not cacheable: the user may accept gaps through provideInput.
    readOnly: false
    timeoutMs: 0 # AI step: no time limit
    config:
      ai: true
      aiAttempts: 2
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]
