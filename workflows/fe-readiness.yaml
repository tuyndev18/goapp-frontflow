# Workflow A — review the built UI against the API contract (spec §12).
# The API contract often arrives after the design: the UI is built from Figma first (B1), and
# A.api_contract waits for the contract without blocking that work. Reading the contract only
# saves it into the project (.frontflow/runs/<run>/api-contract.md). A.review is one editable
# prompt (workflows/prompts/A.review.md) that the agent runs in the project: it compares the
# contract with the UI code it finds there (Figma is not read again) and writes the review the
# host turns into the FE Readiness Package and the gap reports (A2–A8). The "wait for update" loop
# is a single gate: A.review returns waiting_for_input when the package is not_ready. Updated
# sources start a new run (inputs are immutable snapshots, spec §3.6); provideInput({ accept: true })
# continues with the gaps recorded as assumptions.
id: fe-readiness
version: 5
name: Review UI against API contract
description: When the API contract is available, save it into the project and let the agent compare it with the built UI to decide whether the API can be integrated.
requires: [B1.implement_ui]
defaults:
  group: A
  timeoutMs: 300000
  retryPolicy:
    maxAttempts: 1
    backoff: none
    retryableErrors: []

nodes:
  - id: A.api_contract
    type: readiness.read_api
    label: Read API contract
    description: Import the API contract (Markdown or OpenAPI) whenever it is ready; it is saved into the project for the agent to read.
    # Waits for the user to import the contract; not cacheable because it arrives through provideInput.
    readOnly: false
    timeoutMs: 120000
    retryPolicy:
      maxAttempts: 2
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [IO_ERROR]

  - id: A.review
    type: readiness.review
    label: AI reviews UI vs API
    description: The agent compares the API contract with the UI built from Figma (editable prompt) and classifies every UI need; gap reports per owner and the FE Readiness Package follow (A2–A8).
    dependencies: [A.api_contract, B1.implement_ui]
    # Not cacheable: the user may accept gaps through provideInput.
    readOnly: false
    timeoutMs: 2400000
    config:
      ai: true
      aiAttempts: 2
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]
