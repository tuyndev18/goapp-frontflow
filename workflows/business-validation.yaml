# Workflow C — BA-driven Test Design & Auto-test (spec §5, §14).
# C1 turns the BA specification into acceptance test cases (Markdown reports in the run folder)
# from the BA only — not from the API contract, the design or the code — so it runs as soon as the
# BA is imported; C2 builds the automated tests on the integrated frontend.
# A missing BA spec does not block implementation: C1.ba_spec waits with the softer run status
# test_design_pending (spec §11.1); a newer upload (one or more files) can be imported at any time and only the latest
# one is read. C1.test_design waits for input unless its conclusion is `Đủ`.
# C2.ops_guide (optional, no AI, never waits) takes the feature's test operations guide, e.g. how
# to prepare data in the CMS, for the auto-tests only; importing it later runs C2 again.
# C2 generates the Playwright tests once the UI states are in; then the agent runs them the
# project's way, fixes implementation/test-generation gaps and reports (acceptance-tests.md);
# FrontFlow runs no test command itself and waits for the user unless the report says `Đạt`.
id: business-validation
version: 7
name: BA-driven Test Design & Auto-test
description: Design acceptance test cases from the BA specification, then generate and run them against the integrated feature, with an evidence report.
requires: [B2.ui_states]
defaults:
  timeoutMs: 600000
  retryPolicy:
    maxAttempts: 1
    backoff: none
    retryableErrors: []

nodes:
  - id: C1.ba_spec
    type: tests.read_ba
    label: Read BA specification
    group: C1
    description: Import the BA specification (Markdown, one or more files), and again whenever it changes (only the latest upload is read); the agent (editable prompt) lists its business scenarios in a short Markdown report.
    readOnly: false
    timeoutMs: 0 # AI step: no time limit
    config:
      ai: true
      aiAttempts: 2
      waitingRunStatus: test_design_pending
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [IO_ERROR, AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C1.test_design
    type: tests.design
    label: Design acceptance tests
    group: C1
    description: The agent (editable prompt) writes the acceptance test cases of every business scenario from the BA only, and what cannot be tested yet, as a Markdown report; anything but "enough" waits for a newer BA spec or your decision.
    dependencies: [C1.ba_spec]
    # Not cacheable: the user may accept testability gaps through provideInput.
    readOnly: false
    timeoutMs: 0 # AI step: no time limit
    config:
      ai: true
      aiAttempts: 2
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C2.ops_guide
    type: tests.read_ops_guide
    label: Read test operations guide
    group: C2
    description: Optional. Import the guide the auto-tests follow to prepare test data and preconditions (e.g. in the CMS), and a newer version whenever it changes; without one the step passes.
    readOnly: false
    timeoutMs: 120000
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [IO_ERROR]

  - id: C2.generate_tests
    type: ai.acceptance_tests
    label: AI generates auto-tests
    group: C2
    description: Map the acceptance test cases onto the integrated frontend and write one Playwright E2E test per test case (Playwright is set up when missing; the tests are not run here), preparing test data as the operations guide says.
    dependencies: [C1.test_design, C2.ops_guide, B2.ui_states]
    config:
      ai: true
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 3
      backoff: exponential
      baseDelayMs: 5000
      retryableErrors: [AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C2.run_tests
    type: test.acceptance
    label: Run acceptance tests
    group: C2
    description: The agent (editable prompt) runs the feature's Playwright tests the project's way, fixes implementation and test-generation gaps, and reports the result in Markdown; anything but "Đạt" waits for your decision.
    dependencies: [C2.generate_tests]
    config:
      ai: true
      aiAttempts: 2
    mutation: true
    timeoutMs: 0 # AI step: no time limit
    retryPolicy:
      maxAttempts: 2
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED]

  - id: C2.evidence_report
    type: report.evidence
    label: Evidence report
    group: C2
    description: Summarize the run's reports, quality gates, Figma, files changed and evidence in a Markdown report.
    dependencies: [C2.run_tests]
    timeoutMs: 120000
