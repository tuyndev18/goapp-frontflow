# Workflow C — BA-driven Test Design & Auto-test (spec §5, §14).
# C1 turns the BA specification into acceptance test cases from the UI flow and the UI ↔ API
# mapping only, never from the implementation, so it runs in parallel with workflow B.
# A missing BA spec does not block implementation: C1.ba_spec waits with the softer run status
# test_design_pending (spec §11.1). C1.test_design waits for input on blocking testability gaps.
# C2 generates test code once the UI states are in, runs it, and sends
# implementation/test-generation failures through a bounded AI fix loop; specification, design
# and API gaps end blocked with evidence.
id: business-validation
version: 6
name: BA-driven Test Design & Auto-test
description: Generate acceptance test cases from the BA specification, then generate, run and trace them against the integrated feature.
requires: [A.review, B2.ui_states]
defaults:
  timeoutMs: 600000
  retryPolicy:
    maxAttempts: 1
    backoff: none
    retryableErrors: []

nodes:
  - id: C1.ba_spec
    type: tests.read_ba
    label: Read BA specification
    group: C1
    description: Import the BA specification (Markdown); it is saved into the project and the agent (editable prompt) extracts business scenarios, preconditions, test data and expected outcomes with line references.
    readOnly: false
    timeoutMs: 2400000
    config:
      ai: true
      aiAttempts: 2
      waitingRunStatus: test_design_pending
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [IO_ERROR, AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C1.test_design
    type: tests.design
    label: Design acceptance tests
    group: C1
    description: The agent (editable prompt) maps every business scenario to the reviewed screens and API operations and produces the Acceptance Test Case Package; untestable scenarios go to the testability gap report.
    dependencies: [C1.ba_spec, A.review]
    # Not cacheable: the user may accept testability gaps through provideInput.
    readOnly: false
    timeoutMs: 2400000
    config:
      ai: true
      aiAttempts: 2
    retryPolicy:
      maxAttempts: 3
      backoff: linear
      baseDelayMs: 2000
      retryableErrors: [AI_OUTPUT_INVALID, AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C2.generate_tests
    type: ai.acceptance_tests
    label: AI generates auto-tests
    group: C2
    description: Write component, integration and E2E test code for the acceptance test cases with the project's test framework.
    dependencies: [C1.test_design, B2.ui_states]
    config:
      ai: true
    mutation: true
    timeoutMs: 2400000
    retryPolicy:
      maxAttempts: 3
      backoff: exponential
      baseDelayMs: 5000
      retryableErrors: [AGENT_SESSION_FAILED, AGENT_TIMEOUT, NODE_TIMEOUT]

  - id: C2.run_tests
    type: test.acceptance
    label: Run acceptance tests
    group: C2
    description: Run the generated acceptance and E2E tests; failures are classified (specification, design, API, test generation or implementation gap) and fixable ones go to a bounded AI fix loop.
    dependencies: [C2.generate_tests]
    config:
      ai: true
    mutation: true
    timeoutMs: 3600000

  - id: C2.evidence_report
    type: report.evidence
    label: Traceability & evidence
    group: C2
    description: Link every UI interaction to Figma, API, code, tests and evidence, and every BA requirement to its test cases and results.
    dependencies: [C2.run_tests]
    timeoutMs: 120000
